[project]
name = "avogadro-auto3d"
version = "0.2.2"
description = "Auto3D neural-network-potential conformer-generation plugin for Avogadro 2"
authors = [{name = "Geoff Hutchison", email = "geoff.hutchison@gmail.com"}]
license = "BSD-3-Clause"
requires-python = ">=3.11"
# The [ani] extra pulls in torchani, needed for the ANI2x / ANI2xt methods.
dependencies = ["Auto3D[ani]>=3.2.4", "rdkit>=2022.9.5", "torch>=2.8"]

[project.scripts]
avogadro-auto3d = "avogadro_auto3d:main"

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

# .github/workflows/update-dependencies.yml checks PyPI / conda-forge daily for
# these packages and opens a PR raising their ">=" floors and the version.
[tool.update-dependencies]
track = ["Auto3D"]

[tool.avogadro]
minimum-avogadro-version = "1.103"

[[tool.avogadro.menu-commands]]
identifier = "conformers"
input-format = "sdf"
user-options = "customization/auto3d_options.json"
menu = "Extensions"
submenu = "Auto3D"
item = "Generate Conformers…"
menu-priorities = [ 900, 500 ]

# CUDA-capable platform variants are listed first, so pixi prefers them on a
# machine that reports a CUDA driver and falls back to the CPU builds elsewhere.
# All variants share one lock file and one `default` environment, which is what
# Avogadro's package manager installs and runs.
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = [
  { name = "linux-cuda", platform = "linux-64", cuda = "12.0" },
  { name = "win-cuda", platform = "win-64", cuda = "12.0" },
  { name = "linux-cpu", platform = "linux-64" },
  { name = "win-cpu", platform = "win-64" },
  "osx-arm64",
]

# PyTorch and RDKit come from conda-forge so the CUDA / CPU build can be chosen
# per platform; Auto3D itself is only published on PyPI (conda-forge still
# carries 2.3.0, which predates the Auto3DOptions API).
[tool.pixi.dependencies]
python = ">=3.11,<3.14"
rdkit = ">=2022.9.5"

[tool.pixi.target.linux-cuda.dependencies]
pytorch-gpu = ">=2.8"

[tool.pixi.target.win-cuda.dependencies]
pytorch-gpu = ">=2.8"

[tool.pixi.target.linux-cpu.dependencies]
pytorch-cpu = ">=2.8"

[tool.pixi.target.win-cpu.dependencies]
pytorch-cpu = ">=2.8"

[tool.pixi.target.osx-arm64.dependencies]
pytorch = ">=2.8"

[tool.pixi.pypi-dependencies]
avogadro-auto3d = { path = ".", editable = true }

[tool.pixi.tasks]
